services:

  redis:
    image: redis:7-alpine
    container_name: acs-auth-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  keycloak:
    # Stock image, no custom provider. Keycloak holds no credentials: it resolves the user,
    # enforces `enabled`, and issues the token. Password verification happens upstream.
    image: quay.io/keycloak/keycloak:26.7
    container_name: acs-auth-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - kcdata:/opt/keycloak/data

volumes:
  redisdata:
  kcdata:
