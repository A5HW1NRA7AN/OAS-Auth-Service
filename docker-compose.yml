services:

  redis:
    image: redis:7-alpine
    container_name: acs-auth-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  keycloak:
    # Built rather than pulled, so the catalogue password authenticator is baked in.
    # Rebuild with: docker compose up -d --build keycloak
    # (after `mvn -f keycloak/authenticator/pom.xml package`)
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    image: acs-auth-keycloak:26.7
    container_name: acs-auth-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - kcdata:/opt/keycloak/data

volumes:
  redisdata:
  kcdata:
