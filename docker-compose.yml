version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: acs-auth-postgres
    environment:
      POSTGRES_DB: acs_db
      POSTGRES_USER: acs_user
      POSTGRES_PASSWORD: acs_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: acs-auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: acs-auth-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: acs-auth-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: acs-auth-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - kcdata:/opt/keycloak/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: acs-auth-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis

  kibana:
    image: kibana:8.13.0
    container_name: acs-auth-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  pgdata:
  redisdata:
  esdata:
  kcdata:
