services:

  redis:
    image: redis:7-alpine
    container_name: acs-auth-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  keycloak:
    # Stock image, no custom build. Keycloak holds no credentials and runs no custom provider:
    # it resolves the user, enforces the enabled flag, and issues the token. Password
    # verification is the caller's job, upstream of this service entirely.
    image: quay.io/keycloak/keycloak:26.7
    container_name: acs-auth-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - kcdata:/opt/keycloak/data

volumes:
  redisdata:
  kcdata:
