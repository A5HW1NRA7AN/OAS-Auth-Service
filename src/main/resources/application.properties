spring.application.name=acs

# Health probes required by the platform contract (liveness and readiness).
management.endpoint.health.probes.enabled=true

# Redis — the only datastore: token denylist and session index.
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6380}

# Keycloak. base-url is where we CALL Keycloak; issuer is what it STAMPS into tokens.
# In-cluster these differ (Service DNS vs public ingress); a mismatch looks like a
# signature failure, so both are set independently.
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:OAS}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:oas-auth-service}
# Empty by design: a secret here is baked into the jar. Supply via KEYCLOAK_CLIENT_SECRET.
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/OAS}
# The shared RestTemplate has no timeouts, so KeycloakService builds its own with these.
keycloak.connect-timeout-ms=${KEYCLOAK_CONNECT_TIMEOUT_MS:2000}
keycloak.read-timeout-ms=${KEYCLOAK_READ_TIMEOUT_MS:5000}
keycloak.clock-skew-seconds=${KEYCLOAK_CLOCK_SKEW_SECONDS:30}
# Must be >= the realm's access token lifespan, or revoked tokens outlive their entry.
keycloak.denylist-sid-ttl-seconds=${KEYCLOAK_DENYLIST_SID_TTL_SECONDS:900}

# false = auth_token_create takes {userId} and trusts its caller; true = {email, password}
# verified by the catalogue, fail-closed. Confirm the log says mode=VERIFIED after enabling.
catalogue.validate-enabled=${CATALOGUE_VALIDATE_ENABLED:false}
# In-cluster Service DNS, never the public host: this request carries a plaintext password.
catalogue.base-url=${CATALOGUE_BASE_URL:http://localhost:8082}
catalogue.verify-path=${CATALOGUE_VERIFY_PATH:/user/v1/verify}
catalogue.connect-timeout-ms=${CATALOGUE_CONNECT_TIMEOUT_MS:2000}
catalogue.read-timeout-ms=${CATALOGUE_READ_TIMEOUT_MS:5000}
