spring.application.name=acs

# Health probes — required by the platform contract
# (GET /actuator/health/liveness and /readiness).
management.endpoint.health.probes.enabled=true

# Redis — the only datastore this service uses: the token denylist and the session
# index. Spring Boot 3 property names (spring.data.redis.*), autoconfigured.
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6380}

# Keycloak
# base-url is where WE call Keycloak; issuer is what Keycloak STAMPS INTO the token.
# They are separate on purpose: Keycloak derives the issuer from the URL used to reach
# it, so a service calling http://keycloak:8080 in-cluster while tokens are stamped with
# a public ingress URL needs both values, and a mismatch looks like a signature failure.
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:OAS}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:oas-auth-service}
# Deliberately empty: a secret written here is baked into the built jar. Supply it via
# the KEYCLOAK_CLIENT_SECRET environment variable (see .env, gitignored).
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/OAS}
# The shared RestTemplate has no timeouts, so KeycloakService builds its own with these.
keycloak.connect-timeout-ms=${KEYCLOAK_CONNECT_TIMEOUT_MS:2000}
keycloak.read-timeout-ms=${KEYCLOAK_READ_TIMEOUT_MS:5000}
keycloak.clock-skew-seconds=${KEYCLOAK_CLOCK_SKEW_SECONDS:30}
# Must be >= the realm's access token lifespan, or a revoked session's still-valid
# tokens outlive their denylist entry and start working again.
keycloak.denylist-sid-ttl-seconds=${KEYCLOAK_DENYLIST_SID_TTL_SECONDS:900}
